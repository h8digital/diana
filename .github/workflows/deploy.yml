name: Deploy to Cloudflare Workers

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build site
        env:
          PUBLIC_GA4_ID: ${{ secrets.ID_GA4 }}
          PUBLIC_GADS_ID: ${{ secrets.ID_GADS }}
          PUBLIC_FB_PIXEL_ID: ${{ secrets.PIXEL_FACEBOOK }}
        run: npm run build

      - name: Deploy with Wrangler
        uses: cloudflare/wrangler-action@v4
        env:
          TOKEN_PIXEL_META: ${{ secrets.TOKEN_PIXEL_META }}
          PIXEL_FACEBOOK: ${{ secrets.PIXEL_FACEBOOK }}
          CRM_USERNAME: ${{ secrets.USER_CRM }}
          CRM_PASSWORD: ${{ secrets.PASS_CRM }}
          CRM_SESSION_SECRET: ${{ secrets.CRM_SESSION_SECRET }}
          LEADSTER_WEBHOOK_TOKEN: ${{ secrets.LEADSTER_WEBHOOK_TOKEN }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
        with:
          apiToken: ${{ secrets.TOKEN_WORKES_CLOUDFLARE }}
          accountId: 30e1abd4edbb7e0f77cd94a5295470e4
          secrets: |
            TOKEN_PIXEL_META
            PIXEL_FACEBOOK
            CRM_USERNAME
            CRM_PASSWORD
            CRM_SESSION_SECRET
            LEADSTER_WEBHOOK_TOKEN
            RESEND_API_KEY

      # KNOWN BROKEN: this step fails in CI (production has no d1_migrations
      # tracking table, so wrangler replays 0002's `ALTER TABLE ... ADD COLUMN`
      # and hits "duplicate column name"). Kept continue-on-error so it does not
      # block the deploy. Until it is fixed, apply new migrations by hand in the
      # Cloudflare D1 console for the diana-crm database.
      - name: Apply D1 migrations
        continue-on-error: true
        run: npx wrangler d1 migrations apply diana-crm --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.TOKEN_WORKES_CLOUDFLARE }}
          CLOUDFLARE_ACCOUNT_ID: 30e1abd4edbb7e0f77cd94a5295470e4
