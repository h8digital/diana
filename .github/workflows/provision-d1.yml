name: Provision D1 database (one-off)

on:
  workflow_dispatch:

jobs:
  provision:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Create D1 database (idempotent)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.TOKEN_D1 }}
          CLOUDFLARE_ACCOUNT_ID: 30e1abd4edbb7e0f77cd94a5295470e4
        run: npx wrangler d1 create diana-crm || true

      - name: List databases (to read the id if create said "already exists")
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.TOKEN_D1 }}
          CLOUDFLARE_ACCOUNT_ID: 30e1abd4edbb7e0f77cd94a5295470e4
        run: npx wrangler d1 list

      - name: Apply schema migration
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.TOKEN_D1 }}
          CLOUDFLARE_ACCOUNT_ID: 30e1abd4edbb7e0f77cd94a5295470e4
        run: npx wrangler d1 execute diana-crm --remote --file=./migrations/0001_init.sql

      - name: Verify stages seeded
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.TOKEN_D1 }}
          CLOUDFLARE_ACCOUNT_ID: 30e1abd4edbb7e0f77cd94a5295470e4
        run: npx wrangler d1 execute diana-crm --remote --command="SELECT * FROM stages;"
