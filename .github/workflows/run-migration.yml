name: Run D1 migration (one-off)

on:
  workflow_dispatch:

jobs:
  migrate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply schema migration
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.TOKEN_D1 }}
          CLOUDFLARE_ACCOUNT_ID: 30e1abd4edbb7e0f77cd94a5295470e4
        run: npx wrangler d1 execute diana-crm --remote --file=./migrations/0002_add_value.sql

      - name: Verify column added
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.TOKEN_D1 }}
          CLOUDFLARE_ACCOUNT_ID: 30e1abd4edbb7e0f77cd94a5295470e4
        run: npx wrangler d1 execute diana-crm --remote --command="PRAGMA table_info(leads);"
