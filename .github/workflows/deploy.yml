name: Deploy to Cloudflare Workers

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build site
        env:
          PUBLIC_GA4_ID: ${{ secrets.ID_GA4 }}
          PUBLIC_GADS_ID: ${{ secrets.ID_GADS }}
          PUBLIC_FB_PIXEL_ID: ${{ secrets.PIXEL_FACEBOOK }}
        run: npm run build

      - name: Deploy with Wrangler
        uses: cloudflare/wrangler-action@v4
        env:
          TOKEN_PIXEL_META: ${{ secrets.TOKEN_PIXEL_META }}
          PIXEL_FACEBOOK: ${{ secrets.PIXEL_FACEBOOK }}
          CRM_USERNAME: ${{ secrets.USER_CRM }}
          CRM_PASSWORD: ${{ secrets.PASS_CRM }}
          CRM_SESSION_SECRET: ${{ secrets.CRM_SESSION_SECRET }}
        with:
          apiToken: ${{ secrets.TOKEN_WORKES_CLOUDFLARE }}
          accountId: 30e1abd4edbb7e0f77cd94a5295470e4
          secrets: |
            TOKEN_PIXEL_META
            PIXEL_FACEBOOK
            CRM_USERNAME
            CRM_PASSWORD
            CRM_SESSION_SECRET
