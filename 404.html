<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Página não encontrada | Diana Dutra Investimentos</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="robots" content="noindex" />
<link rel="icon" href="wp-content/uploads/2026/03/cropped-cropped-Design-sem-nome-19-32x32.png" sizes="32x32" />
<link rel="stylesheet" href="wp-content/custom/theme-glow.css" />
<style>
  html, body { height: 100%; margin: 0; background: #01152f; font-family: "Montserrat", "Roboto", sans-serif; }
  .not-found {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 32px;
    position: relative;
    z-index: 1;
  }
  .not-found img { width: 140px; height: auto; margin-bottom: 32px; }
  .not-found .card {
    max-width: 520px;
  }
  .not-found h1 {
    font-size: clamp(64px, 12vw, 120px);
    margin: 0;
    line-height: 1;
    background: linear-gradient(135deg, #ffdd5a 0%, #e8b923 100%);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    text-shadow: 0 0 40px rgba(255, 221, 90, 0.3);
  }
  .not-found h2 { color: #fff; font-size: 22px; margin: 8px 0 12px; }
  .not-found p { color: rgba(255,255,255,0.75); font-size: 16px; line-height: 1.6; margin: 0 0 28px; }
  .not-found a.home-link {
    display: inline-block;
    text-decoration: none;
  }
</style>
</head>
<body>
<div class="not-found">
  <img src="wp-content/uploads/2026/03/diana-dutra-logo-white.png" alt="Diana Dutra" />
  <div class="card glass-card" style="padding: 40px 36px;">
    <h1>404</h1>
    <h2>Essa página não existe.</h2>
    <p>O link pode estar desatualizado ou a página foi movida. Volte para a página inicial para continuar navegando.</p>
    <a class="home-link" href="/">
      <button class="elementor-button elementor-size-md elementor-animation-grow" type="button">
        <span class="elementor-button-content-wrapper">
          <span class="elementor-button-text">VOLTAR AO INÍCIO</span>
        </span>
      </button>
    </a>
  </div>
</div>
<script src="wp-content/custom/theme-glow.js"></script>
</body>
</html>
