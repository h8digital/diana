name: Deploy to Cloudflare Workers

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - name: Inject tracking IDs
        env:
          ID_GA4: ${{ secrets.ID_GA4 }}
          ID_GADS: ${{ secrets.ID_GADS }}
          PIXEL_FACEBOOK: ${{ secrets.PIXEL_FACEBOOK }}
        run: |
          sed -i "s/__GA4_ID__/${ID_GA4}/g; s/__GADS_ID__/${ID_GADS}/g; s/__FB_PIXEL_ID__/${PIXEL_FACEBOOK}/g" index.html

      - name: Deploy with Wrangler
        uses: cloudflare/wrangler-action@v4
        env:
          TOKEN_PIXEL_META: ${{ secrets.TOKEN_PIXEL_META }}
          PIXEL_FACEBOOK: ${{ secrets.PIXEL_FACEBOOK }}
        with:
          apiToken: ${{ secrets.TOKEN_WORKES_CLOUDFLARE }}
          accountId: 30e1abd4edbb7e0f77cd94a5295470e4
          secrets: |
            TOKEN_PIXEL_META
            PIXEL_FACEBOOK
